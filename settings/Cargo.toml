[package]
name = "win11-settings"
version = "0.5.36"
edition = "2021"
description = "A Windows 11 style Settings app for Ubuntu, written in Rust"
license = "MIT"

[dependencies]
libc = "0.2"
# glow (OpenGL) only: the default wgpu renderer pulls in wgpu, naga and a
# Vulkan setup. Fonts: Selawik is bundled; system DejaVu is the fallback.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
# Thin LTO over 16 units keeps the final step on every core.
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
