[package]
name = "win11-settings"
version = "0.5.10"
edition = "2021"
description = "A Windows 11 style Settings app for Ubuntu, written in Rust"
license = "MIT"

[dependencies]
eframe = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
